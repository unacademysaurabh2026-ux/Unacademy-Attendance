<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FaceScan • Attendance Scan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <script>
    window.FACESCAN_CONFIG = {
      instituteName: "FaceScan Attendance",
      deviceLabel:   "Institute Device",
      matchThreshold: 0.47,
      modelUrl: "https://cdn.jsdelivr.net/gh/vladmandic/face-api/model/",
    };
  </script>
  <script src="app.js" defer></script>
  <script src="sheets-sync.js" defer></script>
  <style>
    body { background: #020617; color: #f1f5f9; font-family: 'Inter', sans-serif; margin: 0; }
    #attendance-camera-box {
      width: min(88vw, 420px); height: min(88vw, 420px);
      border-radius: 50%; overflow: hidden; position: relative; margin: 0 auto;
      border: 8px solid rgba(255,255,255,0.9);
      box-shadow: 0 0 0 4px rgba(255,255,255,0.2), 0 0 60px rgba(255,255,255,0.55),
                  0 0 100px rgba(255,255,255,0.25), 0 0 140px rgba(255,255,255,0.1);
      background: #0f172a;
    }
    #attendance-camera-box video { width:100%; height:100%; object-fit:cover; }
    #attendance-face-overlay { border-radius: 50% !important; }
    #scan-name-strip {
      min-height: 38px; border-radius: 24px; font-size: 1.05rem; font-weight: 700;
      text-align: center; padding: 8px 20px; color: #fff; letter-spacing: 0.02em;
      transition: background 0.3s ease; margin-top: 14px;
    }
    :fullscreen #attendance-scan-section, :-webkit-full-screen #attendance-scan-section {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; background: #020617; min-height: 100vh; padding: 20px;
    }
  </style>
</head>
<body>

<!-- Top bar -->
<div class="flex items-center justify-between px-4 py-3 bg-slate-900 border-b border-slate-800">
  <div class="flex items-center gap-3">
    <button onclick="window.close()" class="text-slate-400 hover:text-white text-sm px-3 py-1.5 bg-slate-800 rounded-xl">← Back</button>
    <span class="font-bold text-white">🔍 Face Scan</span>
  </div>
  <div class="flex items-center gap-2">
    <span id="institute-label" class="text-xs text-slate-400"></span>
    <span class="text-xs text-emerald-400 font-bold">● LOCAL</span>
  </div>
</div>

<!-- Scan section -->
<div id="attendance-scan-section" class="flex flex-col items-center pt-6 pb-8 px-4">

  <!-- Toolbar -->
  <div class="flex items-center justify-between w-full max-w-sm mb-4">
    <button id="scan-lock-btn" onclick="toggleScanLock()" title="Lock navigation"
      class="w-11 h-11 rounded-2xl bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-xl">🔓</button>
    <p class="text-slate-400 text-sm font-medium">Face Scan</p>
    <div class="flex gap-2">
      <button onclick="flipCamera()" title="Flip camera"
        class="w-11 h-11 rounded-2xl bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-xl">🔄</button>
      <button onclick="toggleFullscreen()" title="Fullscreen"
        class="w-11 h-11 rounded-2xl bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-xl">⛶</button>
    </div>
  </div>

  <!-- Camera circle -->
  <div id="attendance-camera-box">
    <video id="attendance-video" autoplay muted playsinline
      style="width:100%;height:100%;object-fit:cover;"></video>
    <canvas id="attendance-canvas" class="hidden"></canvas>
  </div>

  <!-- Name strip -->
  <div id="scan-name-strip" style="background:transparent;" class="w-full max-w-sm text-white font-bold text-center py-2 px-4 rounded-2xl mt-3 min-h-[40px]"></div>

  <!-- Status -->
  <p id="attendance-status" class="text-sm text-slate-400 mt-2 text-center max-w-xs px-4">
    Camera will start automatically.
  </p>

  <!-- Buttons -->
  <div class="flex gap-3 mt-4 w-full max-w-sm" id="scan-btn-row">
    <button onclick="startAttendanceCamera()" id="start-attendance-btn"
      class="flex-1 bg-slate-700 hover:bg-slate-600 text-white py-4 rounded-3xl font-semibold flex items-center justify-center gap-2">
      📷 Start Camera
    </button>
    <button onclick="captureAttendancePhoto()" id="capture-attendance-btn"
      class="flex-1 bg-sky-500 text-white py-4 rounded-3xl font-semibold flex items-center justify-center gap-2 hidden">
      ✅ Confirm
    </button>
  </div>

  <!-- Hidden for JS compat -->
  <div id="recognition-result" class="hidden">
    <p id="recognition-title"></p>
    <p id="recognition-copy"></p>
    <div id="student-match-list"></div>
  </div>
</div>

<!-- Hidden nav elements needed by app.js -->
<div class="hidden">
  <div id="section-home"></div>
  <div id="section-register"></div>
  <div id="section-attendance"></div>
  <div id="section-records"></div>
  <div id="section-trash"></div>
  <div id="section-unidentified"></div>
  <button id="tab-home"></button>
  <button id="tab-register"></button>
  <button id="tab-attendance"></button>
  <button id="tab-records"></button>
  <button id="tab-trash"></button>
  <button id="tab-unidentified"></button>
  <div id="students-grid"></div>
  <div id="students-list-view"></div>
  <div id="attendance-list-view"></div>
  <tbody id="attendance-table-body"></tbody>
  <div id="trash-list"></div>
  <div id="unidentified-list"></div>
  <div id="unidentified-badge"></div>
  <div id="unidentified-badge-inline"></div>
  <div id="institute-clock"></div>
  <div id="device-label"></div>
  <div id="sms-gateway-slots"></div>
  <div id="sms-used-today"></div>
  <div id="sms-total-limit"></div>
  <button id="show-students-btn"></button>
  <button id="show-attendance-btn"></button>
  <div id="stat-students"></div>
  <div id="stat-today"></div>
  <div id="stat-total"></div>
  <div id="success-modal" class="hidden"></div>
  <div id="edit-modal" class="hidden"></div>
</div>

<script>
  // Auto start camera when page loads
  document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      if (typeof startAttendanceCamera === 'function') startAttendanceCamera();
    }, 1500);
  });
</script>
</body>
</html>
